<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture Uploading - Myownschool</title>
    <link rel="icon" type="image/png" href="images/logo.jpeg">
    <link rel="stylesheet" href="style.css?v=20260603-kids-roots-jand-brand">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .upload-panel { background:#fff; border:1px solid #cfe8e5; border-radius:16px; padding:1.35rem; margin-bottom:1.5rem; box-shadow:0 12px 30px rgba(15,23,42,.07); }
        .upload-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr)); gap:0.75rem; align-items:end; }
        
        .upload-grid > div:last-child { min-width: 0; }
        .upload-grid > div { margin-bottom: 0; }
        .upload-panel label { display:block; color:#334155; font-size:.82rem; font-weight:800; margin-bottom:.35rem; }
        .upload-panel input,.upload-panel select,.upload-panel textarea { width:100%; min-height:42px; border:1px solid #cbd5e1; border-radius:10px; background:#fff; color:#0f172a; padding:.65rem .75rem; font:inherit; outline:none; }
        #lectureUploadForm .upload-grid input,#lectureUploadForm .upload-grid select { min-height:42px; height:42px; padding:.35rem .75rem; }
        .upload-panel textarea { min-height:120px; resize:vertical; margin-top: 0.5rem; }
        .upload-table { width:100%; border-collapse:collapse; }
        .upload-table th,.upload-table td { border-bottom:1px solid #dbecea; padding:.8rem; text-align:left; vertical-align:top; }
        .upload-table th { background:#f6fbfa; color:#475569; font-size:.78rem; text-transform:uppercase; }
        .empty-note { padding:1rem; border:1px dashed #cbd5e1; border-radius:12px; color:var(--text-secondary); background:#f8fafc; }
        .action-row { display:inline-flex; gap:.45rem; flex-wrap:wrap; }
        .mini-btn { min-height:34px; border:0; border-radius:8px; padding:.45rem .7rem; font-weight:800; cursor:pointer; display:inline-flex; align-items:center; gap:.35rem; }
        .mini-btn.edit { background:#dbeafe; color:#1d4ed8; }
        .mini-btn.delete { background:#fee2e2; color:#b91c1c; }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo-section"><img class="sidebar-logo-img" src="images/logo.jpeg" alt="Myownschool logo"></div>
            <nav class="nav-links">
                <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
                <a href="students.html" class="nav-item"><i data-lucide="users"></i><span>Students</span></a>
                <a href="classes.html" class="nav-item"><i data-lucide="school"></i><span>Classes</span></a>
            </nav>
            <a href="settings.html" class="user-profile"><div class="avatar">AD</div><div class="user-info"><h4>Admin User</h4><p>Admin</p></div></a>
        </aside>
        <main class="main-content">
            <header class="header"><div><h1>Lecture Uploading</h1><p style="color:var(--text-secondary); margin-top:.3rem;">Upload class-wise lectures for student portal.</p></div></header>
            <section class="upload-panel">
                <form id="lectureUploadForm">
                    <input type="hidden" id="lectureUploadId">
                    <div class="upload-grid">
                        <div><label for="lectureCampus">Campus</label><select id="lectureCampus" required><option value="">Select Campus</option></select></div>
                        <div><label for="lectureClass">Class</label><select id="lectureClass" required disabled><option value="">Select Campus First</option></select></div>
                        <div><label>Lecture Title</label><input type="text" id="lectureTitle" required placeholder="e.g. Chapter 3 Lecture"></div>
                        <div><label>Subject</label><input type="text" id="lectureSubject" placeholder="e.g. Science"></div>
                        <div><label>Lecture Link</label><input type="url" id="lectureUrl" placeholder="https://..."></div>
                        <div><label>Attach File / Video</label><input type="file" id="lectureFile" accept=".mov,.mkv,.avi,.pdf,.ppt,.pptx,.doc,.docx,.mp4,.webm,.jpg,.jpeg,.png,.txt"></div>
                    </div>
                    <div style="margin-top:1rem;"><label>Lecture Notes</label><textarea id="lectureDetails" required placeholder="Write lecture notes, instructions, or links"></textarea></div>
                    <button type="submit" class="btn btn-primary" id="lectureSaveBtn" style="margin-top:1rem;"><i data-lucide="save"></i> Save Lecture</button>
                <p id="lectureUploadProgress" role="status" hidden></p><small>Maximum file size: 30 GB. Keep this page open during upload.</small></form>
            </section>
            <section class="upload-panel"><h3 style="margin-bottom:1rem;">Uploaded Lectures</h3><div id="lectureUploadList"></div></section>
        </main>
    </div>
    <script src="auth.js?v=20260520-sidebar-requested-order"></script>
    <script src="script.js?v=20260520-sidebar-classes-restore"></script>
    <script>
        (() => {
        const LECTURE_KEY = 'eduCore_uploaded_lectures';
        const API_BASE_URL = '/api';
        function data(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch (_e) { return []; } }
        function save(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (_e) { showAppAlert('File/data is too large to save.', 'Storage Full'); return false; } }
        function esc(value) { return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char])); }
        function mergeLectures(localItems = [], apiItems = []) {
            const map = new Map();
            [...apiItems, ...localItems].forEach((item) => {
                if (!item || !item.id) return;
                map.set(String(item.id), { ...(map.get(String(item.id)) || {}), ...item });
            });
            return [...map.values()].sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
        }
        async function loadLecturesFromApi() {
            try {
                const response = await fetch(`${API_BASE_URL}/uploaded-lectures`);
                if (!response.ok) throw new Error('Lectures API unavailable.');
                const result = await response.json().catch(() => ({}));
                if (!Array.isArray(result.lectures)) return;
                save(LECTURE_KEY, mergeLectures(data(LECTURE_KEY), result.lectures));
            } catch (_error) {
                // Keep local lectures visible if API is temporarily unavailable.
            }
        }
        async function syncLocalLecturesToApi() {
            const items = data(LECTURE_KEY);
            for (const item of items) {
                try {
                    const response = await fetch(`${API_BASE_URL}/uploaded-lectures`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(item)
                    });
                } catch (_error) {}
            }
        }
        function populateCampuses() {
            const selected = lectureCampus.value;
            const extras = [...data('eduCore_classes').map(item => item.campusName), ...data(LECTURE_KEY).map(item => item.campusName)].filter(Boolean);
            const names = getUniqueCampusNames([...extras, ...Array.from(lectureCampus.options).map(option => option.value)]);
            lectureCampus.innerHTML = '<option value="">Select Campus</option>' + names.map(name => `<option value="${esc(name)}">${esc(name)}</option>`).join('');
            lectureCampus.value = selected;
            populateClasses();
        }
        function populateClasses(selected = '') {
            const campus = lectureCampus.value.trim().toLowerCase();
            const students = data('eduCore_students').filter(item => String(item.campusName || 'Main Campus').trim().toLowerCase() === campus);
            const classes = data('eduCore_classes').filter(item => !item.campusName || String(item.campusName).trim().toLowerCase() === campus);
            const names = campus ? [...new Set([...classes.map(item => item.section ? `${item.name} (${item.section})` : item.name), ...students.map(item => item.classGrade)].map(value => String(value || '').trim()).filter(Boolean))].sort() : [];
            lectureClass.disabled = !campus;
            lectureClass.innerHTML = `<option value="">${!campus ? 'Select Campus First' : names.length ? 'Select Class' : 'No Classes Available'}</option>` + names.map(name => `<option value="${esc(name)}">${esc(name)}</option>`).join('');
            if (selected && campus && !names.includes(selected)) lectureClass.add(new Option(selected, selected));
            lectureClass.value = selected;
        }
        async function refreshLectureSelections() {
            try {
                const response = await fetch(API_BASE_URL + '/students');
                if (!response.ok) throw new Error('Students unavailable');
                const result = await response.json();
                const students = Array.isArray(result) ? result : result.students;
                if (Array.isArray(students)) save('eduCore_students', students);
                const campuses = await loadRegisteredCampusNames();
                populateCampusSelect("lectureCampus", campuses, "Select Campus");
            } catch (_error) { /* Use cached campus and class options when offline. */ }
            const selected = lectureClass.value;
            populateCampuses();
            populateClasses(selected);
        }
        async function readFile(input) {
            const file = input.files?.[0];
            if (!file) return null;
            if (file.size > 30 * 1024 ** 3) throw new Error('Maximum file size is 30 GB.');
            const token = sessionStorage.getItem('eduCore_token') || localStorage.getItem('eduCore_token') || '';
            const headers = { Authorization: 'Bearer ' + token };
            const request = async (url, options) => {
                const response = await fetch(url, options);
                const body = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(body.message || 'Upload unavailable. Restart the updated server and retry.');
                return body;
            };
            const upload = await request('/api/lecture-uploads', { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify({ name: file.name, size: file.size, type: file.type }) });
            let offset = 0;
            lectureUploadProgress.hidden = false;
            while (offset < file.size) {
                let completed = false;
                for (let attempt = 0; attempt < 3 && !completed; attempt++) {
                    try {
                        const response = await fetch('/api/lecture-uploads/' + upload.id + '?offset=' + offset, { method: 'PUT', headers: { ...headers, 'Content-Type': 'application/octet-stream' }, body: file.slice(offset, offset + upload.chunkSize) });
                        const body = await response.json();
                        if ((!response.ok && response.status !== 409) || !Number.isSafeInteger(body.offset) || body.offset < 0 || body.offset > file.size) throw new Error(body.message || 'Chunk upload failed.');
                        offset = body.offset;
                        completed = true;
                    } catch (error) { if (attempt === 2) throw error; }
                }
                lectureUploadProgress.textContent = 'Uploading: ' + (offset / file.size * 100).toFixed(1) + '%';
            }
            const result = await request('/api/lecture-uploads/' + upload.id + '/complete', { method: 'POST', headers });
            lectureUploadProgress.textContent = 'Upload complete';
            return result.file;
        }
        function render() {
            const items = data(LECTURE_KEY).sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
            if (!items.length) { lectureUploadList.innerHTML = '<div class="empty-note">No lecture uploaded yet.</div>'; return; }
            lectureUploadList.innerHTML = `<table class="upload-table"><thead><tr><th>Campus</th><th>Class</th><th>Lecture</th><th>Link / File</th><th>Action</th></tr></thead><tbody>${items.map((item) => `<tr><td>${esc(item.campusName || 'All Campuses')}</td><td>${esc(item.classGrade)}</td><td><strong>${esc(item.title)}</strong><br>${esc(item.subject || '-')}<br>${esc(item.details)}</td><td>${item.url ? `<a href="${esc(item.url)}" target="_blank" rel="noopener">Open Link</a><br>` : ''}${(item.file?.url || item.file?.dataUrl) ? `<a href="${esc(item.file.url || item.file.dataUrl)}" download="${esc(item.file.name || 'lecture-file')}">${esc(item.file.name || 'Download')}</a>` : (!item.url ? '-' : '')}</td><td><div class="action-row"><button class="mini-btn edit" onclick="editItem('${item.id}')"><i data-lucide="edit-2" width="14"></i> Edit</button><button class="mini-btn delete" onclick="deleteItem('${item.id}')"><i data-lucide="trash-2" width="14"></i> Delete</button></div></td></tr>`).join('')}</tbody></table>`;
            if (window.lucide) lucide.createIcons();
        }
        function editItem(id) {
            const item = data(LECTURE_KEY).find((entry) => entry.id === id);
            if (!item) return;
            lectureCampus.value = item.campusName || ''; populateClasses(item.classGrade || '');
            lectureFile.value = '';
            lectureUploadId.value = item.id; lectureTitle.value = item.title || ''; lectureSubject.value = item.subject || ''; lectureUrl.value = item.url || ''; lectureDetails.value = item.details || '';
            lectureSaveBtn.innerHTML = '<i data-lucide="save"></i> Update Lecture';
            lectureUploadForm.scrollIntoView({ behavior: 'smooth', block: 'start' }); if (window.lucide) lucide.createIcons();
        }
        async function deleteItem(id) {
            save(LECTURE_KEY, data(LECTURE_KEY).filter((item) => item.id !== id));
            try { await fetch(`${API_BASE_URL}/uploaded-lectures/${encodeURIComponent(id)}`, { method: 'DELETE' }); } catch (_error) {}
            render();
        }
        lectureUploadForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const editId = lectureUploadId.value;
            const existing = data(LECTURE_KEY).find((item) => item.id === editId);
            if (lectureSaveBtn.disabled) return;
            lectureSaveBtn.disabled = true;
            try {
            const file = await readFile(lectureFile);
            const item = { id: editId || `LECTURE-${Date.now()}`, campusName: lectureCampus.value, classGrade: lectureClass.value, title: lectureTitle.value.trim(), subject: lectureSubject.value.trim(), url: lectureUrl.value.trim(), details: lectureDetails.value.trim(), file: file || existing?.file || null, createdAt: existing?.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString() };
            if (!item.campusName || !item.classGrade || !item.title || !item.details) { showAppAlert('Campus, class, title, and notes are required.', 'Missing Lecture'); return; }
            const items = data(LECTURE_KEY); const index = items.findIndex((entry) => entry.id === editId);
            if (index >= 0) items[index] = item; else items.push(item);

            try {
                const response = await fetch(`${API_BASE_URL}/uploaded-lectures`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(item)
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok || result.success === false) throw new Error(result.message || 'Lecture upload failed.');
            } catch (error) { showAppAlert(error.message || 'Unable to upload lecture. Please retry.', 'Upload Failed'); return; }
            save(LECTURE_KEY, items);
            event.target.reset(); populateClasses(); lectureUploadId.value = ''; lectureSaveBtn.innerHTML = '<i data-lucide="save"></i> Save Lecture'; render(); showSuccessModal(editId ? 'Lecture Updated!' : 'Lecture Uploaded!', 'Lecture is visible in student portal.');
            } catch (error) { showAppAlert(error.message || 'Upload failed.', 'Upload Failed'); }
            finally { lectureSaveBtn.disabled = false; }
        });
        lectureCampus.addEventListener("change", () => populateClasses());
        populateCampuses();
        refreshLectureSelections();
        window.editItem = editItem;
        window.deleteItem = deleteItem;
        loadLecturesFromApi().then(syncLocalLecturesToApi).finally(render);
        render();
        if (window.lucide) lucide.createIcons();
        })();
    </script>
</body>

</html>
